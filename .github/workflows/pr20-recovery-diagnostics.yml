name: PR20 recovery diagnostics
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Absens/AI-Developer-Worker' && github.event.pull_request.number == 20 && github.event.pull_request.head.ref == 'test/postgres-integration-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Export tracked source and lockfile-installed tooling
        shell: bash
        run: |
          mkdir -p /tmp/pr20-export
          git archive HEAD | gzip > /tmp/pr20-export/source.tar.gz
          tar -czf /tmp/pr20-export/tooling.tar.gz node_modules
          git rev-parse HEAD > /tmp/pr20-export/source-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr20-debug-checkout
          path: /tmp/pr20-export/
          retention-days: 1
          if-no-files-found: error
