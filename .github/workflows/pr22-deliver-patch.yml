name: Deliver prepared PR22 patch
on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr22-exact-patch-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Absens/AI-Developer-Worker' && github.event.pull_request.number == 22 && github.event.pull_request.head.repo.full_name == 'Absens/AI-Developer-Worker' && github.event.pull_request.head.ref == 'feat/managed-project-settings'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify original base and apply exact prepared artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import bz2, hashlib, subprocess, tempfile
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if git('rev-parse', 'HEAD^') != '9c829f27a6696f5fdb9d31486a7f33aa32cfa939':
              raise SystemExit('Branch base changed; refusing automatic application.')
          if git('rev-parse', 'HEAD^{tree}') == '8e9587ff669b7b1532418486863c6230bcb5a322':
              raise SystemExit('Already applied; refusing duplicate application.')
          if git('rev-parse', 'HEAD^^{tree}') != 'deea8b140d1a82b3dbae6a50e0ff149bcaf5345c':
              raise SystemExit('Unexpected source tree.')
          if git('status', '--porcelain'):
              raise SystemExit('Checkout is not clean.')
          expected = [
              '0fe54056abaf77126921dfd307e41fe7a7e2f15c',
              '73ad7f87c17aa696ed544815932bcee4b94d4151',
              '2f2dc86b219f02c6e214f2441d50842cb5c35d97',
              'f69a24dba2d436cc7dcb0c5252dc65948512a8c0',
              '4fc5c770dbf03d6f9ac88fcbd9c906902f8ca14a',
              '73654aa4278997352f4e92a50aba75a9f91d2c5a',
          ]
          parts = []
          for index, digest in enumerate(expected):
              data = Path(f'.ci/pr22-transfer/part-{index:02d}.bin').read_bytes()
              if blob_sha(data) != digest:
                  raise SystemExit(f'Transport checksum mismatch in part {index}.')
              parts.append(data)
          # Repair a verified one-byte transport typo before decompression.
          corrected = bytearray(parts[2])
          if corrected[3234] != 86:
              raise SystemExit('Unexpected transport byte.')
          corrected[3234] = 82
          if blob_sha(corrected) != '2be8f27d25e34de1fd05f4f53eb24f2530ff75a6':
              raise SystemExit('Corrected transport checksum mismatch.')
          parts[2] = bytes(corrected)
          patch = bz2.decompress(b''.join(parts))
          if hashlib.sha256(patch).hexdigest() != '3b3adbf0635155ab1c57a5a71780c6ce5dd6b04bb26f434d3dded7a4334116b3':
              raise SystemExit('Prepared patch SHA-256 mismatch.')
          if patch.count(b'diff --git ') != 61:
              raise SystemExit('Unexpected file count.')
          with tempfile.NamedTemporaryFile(suffix='.patch') as target:
              target.write(patch)
              target.flush()
              subprocess.run(['git', 'apply', '--check', target.name], check=True)
              subprocess.run(['git', 'apply', '--index', target.name], check=True)
          subprocess.run(['git', 'rm', '-r', '--', '.ci/pr22-transfer', '.github/workflows/pr22-deliver-patch.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          if tree != '8e9587ff669b7b1532418486863c6230bcb5a322':
              raise SystemExit(f'Result differs from prepared artifact: {tree}')
          print(f'Exact prepared artifact verified: {len(patch)} bytes; tree {tree}.')
          PY
      - name: Publish only to the requested PR branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch = 'feat/managed-project-settings'
          remote = 'https://github.com/Absens/AI-Developer-Worker.git'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          actual = git('ls-remote', remote, f'refs/heads/{branch}').split()[0]
          if actual != os.environ['EXPECTED_HEAD']:
              raise SystemExit('Remote branch changed; refusing to overwrite concurrent changes.')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat: apply prepared managed projects and versioned settings UI')
          authorization = base64.b64encode(('x-access-token:' + os.environ['PUSH_TOKEN']).encode()).decode()
          subprocess.run(['git', '-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + authorization,
                          'push', remote, f'HEAD:refs/heads/{branch}'], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Prepared patch applied byte-for-byte. Commit: `' + git('rev-parse', 'HEAD') + '`.\n')
          print('Prepared changes published to PR22. Main was not changed. Full CI is still required.')
          PY
