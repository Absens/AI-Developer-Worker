name: Apply and verify competitor browser implementation

on:
  push:
    branches:
      - feature/telegram-competitor-browser
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch head
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-competitor-browser
          fetch-depth: 0

      - name: Reconstruct and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/competitor-browser-patch/part-* | base64 --decode | gzip --decompress > /tmp/competitor-browser.patch
          echo "9f9b64ecf2aa3ca54655794504daff00ed421d89a45e22b98886c7030b561278  /tmp/competitor-browser.patch" | sha256sum --check
          git apply --check /tmp/competitor-browser.patch
          git apply /tmp/competitor-browser.patch
          git diff --check

      - name: Align Compose with Playwright MCP v0.0.79 CLI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          compose = Path("compose.yaml")
          compose_text = compose.read_text(encoding="utf-8")
          unsupported = "      - --no-sandbox\n"
          if unsupported not in compose_text:
              raise SystemExit("expected --no-sandbox argument was not found in compose.yaml")
          compose.write_text(
              compose_text.replace(unsupported, "", 1),
              encoding="utf-8",
          )

          test_file = Path("tests/playwrightMcpConfig.test.ts")
          test_text = test_file.read_text(encoding="utf-8")
          expectation = '      "--no-sandbox",\n'
          if expectation not in test_text:
              raise SystemExit("expected --no-sandbox assertion was not found in test")
          test_file.write_text(
              test_text.replace(expectation, "", 1),
              encoding="utf-8",
          )
          PY
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Focused browser verification tests
        run: npx vitest run tests/playwrightMcpConfig.test.ts tests/telegramCompetitorResearch.test.ts tests/telegramAssistantCodex.test.ts tests/telegramAssistant.test.ts tests/codexRunner.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate Compose and Playwright MCP sidecar
        env:
          HOST_CODEX_HOME: /tmp/ai-worker-codex-home
          TARGET_REPO_PATH: /tmp/ai-worker-target-repo
          COMPOSE_PROJECT_NAME: ai-worker-browser-ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOST_CODEX_HOME" "$TARGET_REPO_PATH"
          docker compose config > /tmp/ai-worker-compose.yml
          docker run --rm --entrypoint node \
            mcr.microsoft.com/playwright/mcp:v0.0.79 \
            /app/cli.js --help > /tmp/playwright-mcp-help.txt
          grep -q -- "--headless" /tmp/playwright-mcp-help.txt
          grep -q -- "--isolated" /tmp/playwright-mcp-help.txt
          grep -q -- "--port" /tmp/playwright-mcp-help.txt
          grep -q -- "--host" /tmp/playwright-mcp-help.txt
          cleanup() {
            docker compose logs --no-color playwright || true
            docker compose down --volumes || true
          }
          trap cleanup EXIT
          docker compose up --detach playwright
          container_id="$(docker compose ps --quiet playwright)"
          test -n "$container_id"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done
          echo "Playwright MCP did not become healthy in time." >&2
          exit 1

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/competitor-browser-patch
          rm -f .github/workflows/export-browser-source.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: verify competitor sources through Playwright MCP"
          git push origin HEAD:feature/telegram-competitor-browser
