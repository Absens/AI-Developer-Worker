name: PR20 recovery validation

on:
  push:
    branches: [maintenance/pr20-recovery-validation]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm ci
      - name: Archive tracked source and test dependencies only
        run: |
          mkdir -p /tmp/pr20-snapshot
          git archive HEAD | tar -x -C /tmp/pr20-snapshot
          cp -a node_modules /tmp/pr20-snapshot/node_modules
          tar -czf /tmp/pr20-snapshot.tgz -C /tmp/pr20-snapshot .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr20-recovery-snapshot
          path: /tmp/pr20-snapshot.tgz
          retention-days: 1
          include-hidden-files: false
