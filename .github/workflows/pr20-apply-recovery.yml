name: Apply verified PR20 recovery
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Absens/AI-Developer-Worker' && github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/postgres-integration-ci'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_developer_ci_test
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker -d ai_developer_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TASK_TRACKER_TEST_DATABASE_URL: postgresql://tracker:tracker@127.0.0.1:5432/ai_developer_ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply exact locally tested changes to this branch only
        run: |
          test "$(git log -1 --format=%s)" = 'chore: stage verified PR20 recovery changes'
          test "$(git rev-parse HEAD^)" = 'c76ba8bb655ea7726fbe626ded6c6b46a4aa4a8f'
          python3 .ci/pr20-01.py
          python3 .ci/pr20-02.py
          python3 .ci/pr20-03.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected=json.loads(Path('.ci/pr20-expected.json').read_text())
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha,(path,actual,sha)
          p=Path('.github/workflows/ci.yml')
          p.write_text(p.read_text().replace('not application or production secrets.','not application or production credentials.'))
          print('Every runtime/test file matches the locally verified blob.')
          PY
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests without activating legacy optional DB suites
        run: env -u TASK_TRACKER_TEST_DATABASE_URL npm test
      - run: npm run build
      - run: npm run test:postgres
      - name: Publish verified runtime commit to PR20 only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git restore .github/workflows/ci.yml
          git diff --check
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover abandoned tasks only after verified executor stop'
          credential='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          remote=$(git -c credential.helper="$credential" ls-remote origin refs/heads/test/postgres-integration-ci | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git -c credential.helper="$credential" push origin HEAD:refs/heads/test/postgres-integration-ci
          git rev-parse HEAD
