name: Settings development snapshot
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Absens/AI-Developer-Worker' && github.event.pull_request.head.ref == 'feat/managed-project-settings'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix web ci
      - name: Export source and locked development dependencies only
        run: |
          mkdir -p /tmp/settings-snapshot
          git archive --format=tar.gz HEAD > /tmp/settings-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/settings-snapshot/source-head.txt
          tar -czf /tmp/settings-snapshot/tooling.tar.gz node_modules web/node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: settings-dev-snapshot
          path: /tmp/settings-snapshot/
          retention-days: 1
          if-no-files-found: error
